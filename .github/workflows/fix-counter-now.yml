name: Fix review counter (broken HTML)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-counter-now.yml'
      - '.github/scripts/fix_counter_now.py'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Clone and fix
        env:
          PAT: ${{ secrets.SATELLITE_DEPLOY_TOKEN }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/carpentraspizzanapoli-design/pizza-napoli.git site
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd ..
          python3 .github/scripts/fix_counter_now.py site/index.html
          cd site
          if git diff --quiet; then
            echo "No changes"
          else
            git add index.html
            git commit -m "Fix broken review counter HTML (526 avis Google)"
            git push origin main
          fi
