name: Site guard (invariants SEO)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/site-guard.yml'
      - '.github/scripts/site_guard.py'
      - '.github/data/carte.json'
  schedule:
    - cron: '15 8 * * 1'
  workflow_run:
    workflows: ["Sync Google Reviews (auto weekly)"]
    types: [completed]

concurrency:
  group: pizza-napoli-prod
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone production site
        env:
          PAT: ${{ secrets.SATELLITE_DEPLOY_TOKEN }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/carpentraspizzanapoli-design/pizza-napoli.git site
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Install Pillow
        run: pip install --quiet Pillow   # reads real image dimensions

      - name: Enforce invariants
        run: python3 .github/scripts/site_guard.py site

      # Rien ne part en ligne sans que le site corrigé ait été ouvert dans un
      # vrai navigateur. Si une seule vérification échoue, le job s'arrête ici
      # et la production garde la version précédente.
      - name: Install Chromium
        run: |
          npm install --no-audit --no-fund --silent playwright
          npx playwright install --with-deps chromium
      - name: Serve the corrected site
        run: |
          (cd site && python3 -m http.server 8899 >/dev/null 2>&1 &)
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8899/ && break || sleep 1
          done
      - name: Test before deploying
        run: |
          echec=0
          for s in minimums liens-internes; do
            echo "::group::$s"
            if SITE_DIR=site node "tests/$s.js"; then echo "$s : OK"
            else echo "::error::$s a échoué"; echec=1; fi
            echo "::endgroup::"
          done
          for t in bouton-commande offres-boisson parcours-commande carte \
                   notification-commande consentement dom-rendu acces-commande banniere \
                   minimum-visible; do
            echo "::group::$t"
            if node "tests/$t.js"; then echo "$t : OK"; else echo "::error::$t a échoué"; echec=1; fi
            echo "::endgroup::"
          done
          if [ "$echec" = "1" ]; then
            echo "::error::Déploiement annulé : le site corrigé ne passe pas les tests"
            exit 1
          fi

      - name: Commit and push (rebase + retry)
        run: |
          cd site
          if [ -z "$(git status --porcelain)" ]; then echo "Site conforme, rien à pousser"; exit 0; fi
          git add -A
          git commit -q -m "Site guard: normalisation automatique (rating, canonicals, sitemap, images)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin main && { echo "Poussé (tentative $i)"; exit 0; }
            echo "Push rejeté, nouvelle tentative..."; sleep $((i*5))
          done
          echo "::error::Push impossible après 5 tentatives"; exit 1
