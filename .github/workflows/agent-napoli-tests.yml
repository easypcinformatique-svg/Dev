name: Agent Pizza Napoli (tests)

on:
  push:
    paths: ['agent-napoli/**', '.github/workflows/agent-napoli*.yml']
  pull_request:
    paths: ['agent-napoli/**', '.github/workflows/agent-napoli*.yml']

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-napoli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent-napoli/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
