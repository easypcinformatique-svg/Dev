name: Fix sub-pages SEO (ratings text, og:image, main, sitemap)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/seo-fix-subpages.yml'
      - '.github/scripts/seo_fix_subpages.py'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone production site
        env:
          PAT: ${{ secrets.SATELLITE_DEPLOY_TOKEN }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/carpentraspizzanapoli-design/pizza-napoli.git site
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Apply fixes
        run: python3 .github/scripts/seo_fix_subpages.py site
      - name: Commit and push
        run: |
          cd site
          if git diff --quiet; then echo "No changes"; else
            git add -A
            git commit -m "SEO sub-pages: sync visible rating text, og:image, <main>, restore guide URLs in sitemap"
            git push origin main
          fi
