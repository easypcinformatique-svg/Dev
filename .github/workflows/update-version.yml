name: Update site version date

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-version.yml'
  workflow_run:
    workflows:
      - "Site guard (invariants SEO)"
      - "Restore pizzeria site from backup"
    types: [completed]

concurrency:
  group: pizza-napoli-prod
  cancel-in-progress: false

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Update version in production site
        env:
          PAT: ${{ secrets.SATELLITE_DEPLOY_TOKEN }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/carpentraspizzanapoli-design/pizza-napoli.git site
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          export VERSION_DATE=$(TZ='Europe/Paris' date '+%d/%m/%Y')
          export VERSION_TIME=$(TZ='Europe/Paris' date '+%Hh%M')
          echo "New version: v. ${VERSION_DATE} - ${VERSION_TIME}"

          python3 << 'PYEOF'
          import re, os
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          vdate, vtime = os.environ['VERSION_DATE'], os.environ['VERSION_TIME']
          new_content, count = re.subn(r'v\.[^<]*\d{2}h\d{2}[^<]*', f'v. {vdate} &middot; {vtime}', content, count=1)
          if count:
              with open('index.html', 'w', encoding='utf-8') as f:
                  f.write(new_content)
              print(f'Version set to: v. {vdate} &middot; {vtime}')
          else:
              print('WARNING: No version pattern found in index.html')
          PYEOF

          if git diff --quiet; then echo "No changes needed"; exit 0; fi
          git add index.html
          git commit -q -m "Update version: ${VERSION_DATE} ${VERSION_TIME}"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin main && { echo "Version updated and pushed!"; exit 0; }
            echo "Push rejeté, nouvelle tentative..."; sleep $((i*5))
          done
          echo "::error::Push impossible après 5 tentatives"; exit 1
