name: Fix remaining SEO issues

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/seo-fix-remaining.yml'
      - '.github/scripts/seo_fix_remaining.py'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone production site
        env:
          PAT: ${{ secrets.SATELLITE_DEPLOY_TOKEN }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/carpentraspizzanapoli-design/pizza-napoli.git site
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Apply remaining SEO fixes
        run: python3 .github/scripts/seo_fix_remaining.py site

      - name: Commit and push
        run: |
          cd site
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes"
          else
            git add -A
            git diff --cached --stat
            git commit -m "SEO: fix headings, canonicals, dates, CTA clarity"
            git push origin main
          fi
