name: Agent Pizza Napoli (rapport de 9h)

# Deux horaires pour tomber sur 9h à Paris été comme hiver ; le programme
# ne fait rien avant 9h et ne refait pas un rapport déjà envoyé.
on:
  schedule:
    - cron: '0 7 * * *'   # 9h Paris en heure d'été
    - cron: '0 8 * * *'   # 9h Paris en heure d'hiver
  workflow_dispatch:
    inputs:
      mode:
        description: 'essai = ne rien écrire ; forcer = passage complet maintenant'
        type: choice
        options: [essai, forcer]
        default: essai

concurrency:
  group: agent-napoli
  cancel-in-progress: false

jobs:
  passage:
    # Interrupteur : variable de dépôt AGENT_NAPOLI_ACTIF (Settings > Secrets and variables > Actions > Variables).
    # Tant qu'elle ne vaut pas « true », l'agent ne tourne pas.
    if: vars.AGENT_NAPOLI_ACTIF == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent-napoli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent-napoli/requirements.txt

      - run: pip install -r requirements.txt

      - name: Passage de l'agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GERANTS_EMAILS: ${{ vars.GERANTS_EMAILS }}
          COMPTABLE_EMAIL: ${{ vars.COMPTABLE_EMAIL }}
          JOURS_FERMES: ${{ vars.JOURS_FERMES }}
          JOURS_HISTORIQUE: ${{ vars.JOURS_HISTORIQUE }}
          OFFERTS_INCLUENT_BOISSONS: ${{ vars.OFFERTS_INCLUENT_BOISSONS }}
          AGENT_MODELE: ${{ vars.AGENT_MODELE }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || '' }}
        run: |
          case "$MODE" in
            essai)  python -m agent_napoli --essai --forcer ;;
            forcer) python -m agent_napoli --forcer ;;
            *)      python -m agent_napoli ;;
          esac

      - name: Rapport d'essai
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'essai'
        uses: actions/upload-artifact@v4
        with:
          name: rapport-essai
          path: agent-napoli/rapport-essai-*.html
          if-no-files-found: ignore
          retention-days: 7
