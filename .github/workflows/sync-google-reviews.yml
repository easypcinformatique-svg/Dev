name: Sync Google Reviews (auto weekly)

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sync-google-reviews.yml'
      - '.github/scripts/sync_google_reviews.py'
  schedule:
    # Every Monday at 8:00 UTC (10:00 Paris)
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      override_rating:
        description: 'Manual rating override (e.g. 4.5)'
        required: false
      override_count:
        description: 'Manual review count override (e.g. 526)'
        required: false

concurrency:
  group: pizza-napoli-prod
  cancel-in-progress: false

jobs:
  sync-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone production site
        env:
          PAT: ${{ secrets.SATELLITE_DEPLOY_TOKEN }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/carpentraspizzanapoli-design/pizza-napoli.git site
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Google reviews
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: "ChIJ6-i2vRmKtRIRwMwe1UNYRZY"
          OVERRIDE_RATING: ${{ github.event.inputs.override_rating }}
          OVERRIDE_COUNT: ${{ github.event.inputs.override_count }}
        run: |
          python3 .github/scripts/sync_google_reviews.py site/index.html

      - name: Commit and push (rebase + retry)
        run: |
          cd site
          if git diff --quiet; then echo "No changes - reviews already up to date"; exit 0; fi
          git add -A
          RATING=$(python3 -c "
          import re
          c=open('index.html').read()
          m=re.search(r'ratingValue.:.(\d\.\d)', c); n=re.search(r'reviewCount.:.(\d+)', c)
          print(f'{m.group(1)}/5 - {n.group(1)} avis' if m and n else 'updated')")
          git commit -q -m "Auto-sync Google reviews: ${RATING}"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin main && { echo "Reviews synced: ${RATING}"; exit 0; }
            echo "Push rejeté, nouvelle tentative..."; sleep $((i*5))
          done
          echo "::error::Push impossible après 5 tentatives"; exit 1
